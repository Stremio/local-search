[package]
name = "localsearch"
version = "0.1.0"
authors = ["Martin Kavík <martin@kavik.cz>"]
edition = "2021"

# because of `#![feature(const_fn_trait_bound)]` stabilized in 1.61
# https://github.com/rust-lang/rust/issues/93706
rust-version = "1.61"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fxhash = "0.2"
fst = { version = "0.4" }
utf8-ranges = "1.0"
num-traits = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
